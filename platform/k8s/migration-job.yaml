apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrations
  namespace: taskflow
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: taskflow-migrations
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres-to-running
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -h taskflow-postgres -p 5432 -U "$DB_USER"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
      containers:
        - name: migrate
          image: taskflow-migrator:local
          imagePullPolicy: IfNotPresent
          args:
            [
              "-path",
              "/migrations",
              "-database",
              "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable",
              "up",
            ]
          env:
            - name: DB_HOST
              value: taskflow-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB


name: TaskFlow CI and ECR

on:
  workflow_run:
    workflows:
      - TaskFlow CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.ECR_REPO }}

jobs:
  build-and-push:
    name: Build and Push to ECR

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Validate ECR configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ECR_REPO" ]]; then
            echo "Error: ECR_REPO is empty."
            exit 1
          fi

          if [[ ! "$ECR_REPO" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com([.]cn)?/[^:]+$ ]]; then
            echo "Error: ECR_REPO must be a repository URI without an image tag."
            echo "Received: $ECR_REPO"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Error: IMAGE_TAG must be a 40-character commit SHA."
            exit 1
          fi

          echo "ECR repository configuration is valid."
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image
        run: docker build -t "taskflow-cloud:${IMAGE_TAG}" .

      - name: Tag image for ECR
        run: docker tag "taskflow-cloud:${IMAGE_TAG}" "${ECR_REPO}:${IMAGE_TAG}"

      - name: Push image to ECR
        run: docker push "${ECR_REPO}:${IMAGE_TAG}"

nameOverride: taskflow-be
fullnameOverride: taskflow-be

replicaCount: 2

podLabels:
  - env: dev
  - team: backend-core

image:
  repository: taskflow
  tag: local
  pullPolicy: IfNotPresent

service:
  containerPortName: container-http-port
  containerPort: 8080

livenessProbe:
  enabled: true
  path: /health
  port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Wave -1: both Secrets must exist before Postgres (wave 0) reads
# auth.existingSecret and before the migration Job and app reference them.
# Values are not kept in git; they come from the Argo CD Application.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.dbSecretName }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Key names are the Bitnami postgresql chart defaults.
  password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  postgres-password: {{ required "secrets.postgresAdminPassword is required" .Values.secrets.postgresAdminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.appSecretName }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}

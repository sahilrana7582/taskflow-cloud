apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow.fullname" . }}
  labels: 
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "taskflow.labels" . | nindent 4}}
  ports:
    - name: http
      port: {{ .Values.service.port}}
      targetPort: {{.Values.service.containerPortName}}
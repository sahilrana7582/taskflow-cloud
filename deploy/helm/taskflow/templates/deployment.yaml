apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "taskflow.fullname" .}}
  labels: {{- include "taskflow.labels" . | nindent 4}}
spec:
  {{-if not .Values.autoscaling.enabled}}
  replicas: {{.Values.replicaCount}}
  {{-end}}
  selector:
    matchLabels:
      {{- include "taskflow.selectorLabels" . | nindent 6}}
  template:
    labels:
      {{- include "taskflow.labels" .}}
      {{- with .Values.podLabels}}
      {{- toYaml . | nindent 6}}
      {{- end}}
    spec:
      container:
        name: {{ .Chart.Name}}
        image: "{{ .Values.image.repostiory}}:{{ .Values.image.tag}}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: {{ .Values.service.containerPortName}}
            containerPort: {{ .Values.service.containerPort}}
            protocol: tcp
        {{- with .Values.readinessProbe}}
        {{- if .enabled}}
        readinessProbe:
          {{- omit . "enabled" | toYaml | nindent 10 }}
        {{- end}}
        {{- end }}
        {{- with .Values.livenessProbe}}
        {{- if .enabled}}
        livenessProbe:
          {{- omit . "enabled" | toYaml | nindent 10 }}
        {{- end}}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}


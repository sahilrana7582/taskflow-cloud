apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskflow.fullname" . }}-migrations
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
  annotations:
    # A Sync hook is recreated on every sync, so the immutable Job spec never
    # blocks an upgrade. Wave 1 = after Postgres (wave 0) is healthy, before
    # the app (wave 2). `migrate up` is a no-op when nothing is pending.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "taskflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - -path
            - /migrations
            - -database
            - postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)
            - up
          env:
            - name: DB_HOST
              value: {{ .Values.env.TASKFLOW_DATABASE_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.TASKFLOW_DATABASE_PORT | quote }}
            - name: DB_NAME
              value: {{ .Values.env.TASKFLOW_DATABASE_NAME | quote }}
            - name: DB_USER
              value: {{ .Values.env.TASKFLOW_DATABASE_USER | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.env.TASKFLOW_DATABASE_SSLMODE | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: password
